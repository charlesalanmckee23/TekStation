workflows:
  ios-workflow:
    name: TekStation iOS

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.tekstation.app

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Verify TekStation web application
        script: |
          npm run verify:web

      - name: Add iOS platform
        script: |
          npx cap add ios

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Apply iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Build TekStation
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
